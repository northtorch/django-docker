# nginx + uWSGI + Django を Docker で動かす
#
#   SECRET_KEY=$(uv run python get_random_secret_key.py) docker compose up -d --build
#   ブラウザで http://localhost:8000/ を開く
#
# 待ち受けるポートは WEB_PORT で変えられる（例: WEB_PORT=8080）
# サーバで動かすときは、DJANGO_ALLOWED_HOSTS にドメイン名を足す

services:
  app:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.server
    command: >
      bash -c "python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      uwsgi --ini deploy/uwsgi.ini --socket :8001"
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY を設定してください}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
    volumes:
      - db:/opt/app/db
      - static:/opt/app/staticfiles
    restart: unless-stopped

  web:
    image: nginx:stable
    ports:
      - "${WEB_PORT:-8000}:80"
    volumes:
      - ./deploy/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/static:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  db:
  static:
