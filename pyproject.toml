[project]
name = "django-docker"
version = "0.1.0"
description = "DB 上の数値をインクリメントするだけの Django サンプル"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "django-debug-toolbar>=5.0",
    "django-static-md5url>=0.1",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-django>=4.8",
    "ruff>=0.6",
]
# サーバ・Docker で uWSGI を使うときだけ入れる（ビルドに C コンパイラが要る）
server = [
    "uwsgi>=2.0.28",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 119
extend-exclude = ["migrations", "log", "reload", "static"]

[tool.ruff.lint]
select = ["C", "E", "F", "W", "B", "I"]

[tool.mypy]
python_version = "3.12"
show_column_numbers = true
show_error_context = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
exclude = "/test_\\*.py$"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings_for_pytest"
addopts = "-p no:warnings"
