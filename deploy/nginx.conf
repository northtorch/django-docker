# nginx のサイト設定（サーバ用）
#
# 置き場所: /etc/nginx/sites-available/django-docker
#           ln -s /etc/nginx/sites-available/django-docker /etc/nginx/sites-enabled/
# example.com は、自分のサーバのドメイン名に置き換える
# https の設定は、certbot --nginx が自動で書き足す

server {
    listen 80;
    server_name example.com;
    charset utf-8;

    location /static/ {
        alias /var/www/django-docker/static/;
    }

    location / {
        uwsgi_pass 127.0.0.1:8001;
        include uwsgi_params;
    }
}

server_tokens off;
