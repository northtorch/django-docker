# uWSGI の設定（サーバと Docker で共通）
#
# 待ち受け方は、起動するときにオプションで指定する
#   サーバ（nginx の後ろ）: uwsgi --ini deploy/uwsgi.ini --socket 127.0.0.1:8001
#   Docker（nginx の後ろ）: uwsgi --ini deploy/uwsgi.ini --socket :8001
#   Docker（単体で確認）  : uwsgi --ini deploy/uwsgi.ini --http :8000

[uwsgi]
# このファイルの 1 つ上（リポジトリのルート）で動かす
chdir           = %d..
module          = core.wsgi

master          = true
processes       = 2
# SIGTERM で止まるようにする（systemd・Docker から止めるため）
die-on-term     = true
vacuum          = true

touch-logreopen = %d../reload/logreopen
touch-reload    = %d../reload/reload
