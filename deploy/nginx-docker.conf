# nginx のサイト設定（Docker 用。compose.yaml から読み込む）

upstream app {
    server app:8001;
}

server {
    listen 80;
    server_name _;
    charset utf-8;

    location /static/ {
        alias /static/;
    }

    location / {
        uwsgi_pass app;
        include uwsgi_params;
    }
}

server_tokens off;
